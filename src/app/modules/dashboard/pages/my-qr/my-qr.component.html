<div class="min-h-screen bg-gray-50 px-4 py-8">

  <div class="max-w-md mx-auto">

    <!-- Header -->
    <div class="flex items-center mb-6">

      <button
        routerLink="/dashboard"
        class="w-10 h-10 rounded-full bg-white border border-gray-200
               flex items-center justify-center text-gray-600
               hover:bg-gray-100 transition">

        <span class="text-xl">←</span>

      </button>

      <div class="ml-3">

        <h1 class="text-xl font-semibold text-gray-800">
          Digital Member ID
        </h1>

        <p class="text-sm text-gray-500">
          Your digital membership card
        </p>

      </div>

    </div>


    <!-- Member Card -->
    <div
      class="bg-white rounded-3xl shadow-sm
             border border-gray-100 overflow-hidden">

      <!-- Top section -->
      <div class="bg-gradient-to-r from-orange-500 to-orange-600
                  px-6 py-6 text-white">

        <div class="flex items-center justify-between">

          <div>

            <p class="text-xs uppercase tracking-wider opacity-80">
              WorkShed
            </p>

            <h2 class="text-xl font-semibold mt-1">
              Digital Member ID
            </h2>

          </div>

          <div
            class="w-12 h-12 rounded-xl bg-white/20
                   flex items-center justify-center">

            <span class="text-2xl">
              ▦
            </span>

          </div>

        </div>

      </div>


      <!-- QR -->
      <div class="px-6 pt-8 pb-6 text-center">

        <p class="text-sm text-gray-500 mb-5">
          Scan this QR code for event check-in
        </p>

        <div class="flex justify-center">

          <div
            class="p-4 bg-white rounded-2xl
                   border border-gray-100 shadow-sm">

            <qrcode
              [qrdata]="userInfoText"
              [width]="300"
              [errorCorrectionLevel]="'H'"
              [elementType]="'canvas'">
            </qrcode>

          </div>

        </div>

      </div>


      <!-- Member information -->
      <div class="border-t border-gray-100 px-6 py-6">

        <div class="mb-4">

          <p class="text-xs uppercase tracking-wide text-gray-400">
            Member
          </p>

          <p class="text-lg font-semibold text-gray-800 mt-1">
            {{ username }}
          </p>

        </div>


        <div>

          <p class="text-xs uppercase tracking-wide text-gray-400">
            Email
          </p>

          <p class="text-sm text-gray-600 mt-1 break-all">
            {{ email }}
          </p>

        </div>

      </div>


      <!-- Instructions -->
      <div class="px-6 pb-6">

        <div
          class="bg-orange-50 border border-orange-100
                 rounded-2xl p-4">

          <div class="flex gap-3">

            <div class="text-orange-500 text-lg">
              ℹ
            </div>

            <div>

              <p class="text-sm font-medium text-orange-800">
                Keep your Member ID available
              </p>

              <p class="text-xs text-orange-700 mt-1 leading-relaxed">
                Show this QR code when attending WorkShed
                events or when requested by staff.
              </p>

            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- Back button -->
    <div class="text-center mt-6">

      <button
        routerLink="/dashboard"
        class="text-sm text-gray-500 hover:text-orange-600
               transition">

        ← Back to Dashboard

      </button>

    </div>

  </div>

</div>
